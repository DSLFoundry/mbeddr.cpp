pluginManagement {
    repositories {
        maven { url = 'https://artifacts.itemis.cloud/repository/maven-mps' }
        // Need to manually re-add the default Gradle plugin portal repository when overriding the defaults.
        gradlePluginPortal()
    }
}

// Single place for the project's own dependency repositories (build.gradle no
// longer declares its own `repositories {}` block). Note this doesn't cover
// build.gradle's `buildscript { repositories {} }` block -- buildscript
// classpath resolution is a separate mechanism from dependencyResolutionManagement
// and can't be centralized here.
dependencyResolutionManagement {
    repositories {
        maven { url = 'https://artifacts.itemis.cloud/repository/maven-mps/' }
        mavenCentral()
    }
}

rootProject.name = 'mbeddr.cpp'
