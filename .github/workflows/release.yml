name: Release to Github

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Install C++ build tools
      run: sudo apt-get update && sudo apt-get install -y g++ make xvfb
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: release to github with gradle
      # githubRelease depends on build, which now runs the full test suite (see
      # build.gradle) -- testTsTests boots a real (headed) MPS/IntelliJ-platform
      # instance, so it needs a display, same as the other two workflows.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CI_COMMIT_SHA: ${{ github.sha }}
      run: xvfb-run --auto-servernum ./gradlew githubRelease

